</section>
</div>

<div id="tagged-modal" class="fixed inset-0 z-30 bg-black/85 flex items-center justify-center p-4 hidden"><div class="bg-slate-950 border border-slate-800 w-full max-w-xs rounded-3xl p-6 text-center space-y-5"><h3 class="font-black text-white">CONFIRM TAGGED STATUS</h3><p class="text-xs text-slate-400">Were you caught by the Hunter?</p><div class="grid grid-cols-2 gap-3"><button onclick="confirmTagged(true)" class="bg-rose-600 text-white font-bold py-3 rounded-xl">Yes</button><button onclick="closeTaggedModal()" class="bg-slate-800 text-white font-bold py-3 rounded-xl">No</button></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:'AIzaSyAtvpK18T3twmdG3FCf9fLbuwXepletouk',authDomain:'diluu-d8441.firebaseapp.com',projectId:'diluu-d8441',storageBucket:'diluu-d8441.firebasestorage.app',messagingSenderId:'28253953439',appId:'1:28253953439:web:f1f4266ca95c980ee831aa',measurementId:'G-E1ELEEX02N'};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const roomCode=new URLSearchParams(location.search).get('code');
if(!roomCode){document.getElementById('status-title').textContent='ROOM CODE MISSING';throw new Error('Open game.html through the room role screen.');}
const myName=localStorage.getItem('shadowhunt_codename')||'AGENT';
const playerId=myName.replace(/[.#$\/\[\]]/g,'_');
const roomRef=db.ref('rooms/'+roomCode),playersRef=roomRef.child('players'),myPlayerRef=playersRef.child(playerId),settingsRef=roomRef.child('settings'),gameStatusRef=roomRef.child('gameStatus'),zoneStateRef=roomRef.child('zoneState');
let assignedRole=localStorage.getItem('shadowhunt_assigned_role')||'SHADOW';
let currentSettings={radius:'400 m',headstart:'2 min',matchLength:'30 min',shrinkInterval:'2 min'};

const remoteMarkers={},remoteAccuracyCircles={};
let lastSentLocation=null,lastLocationWriteAt=0,currentHeading=0,compassEnabled=false,lastHeadingWriteAt=0,latestPlayers=null,revealActive=false,knownEliminations=new Set(),playersSnapshotInitialized=false,noticeTimeout=null;
map=L.map('map',{zoomControl:false}).setView([28.6139,77.2090],16);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,subdomains:'abc',attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'}).addTo(map);

function pointerIcon(role,heading){const type=role==='HUNTER'?'hunter':'shadow';return L.divIcon({className:'',html:'<div class="player-pointer '+type+'" style="transform:rotate('+(Number(heading)||0)+'deg)"></div>',iconSize:[28,28],iconAnchor:[14,14]})}
function setZone(center){
    const zoneLocation=zoneCenter?[zoneCenter.lat,zoneCenter.lng]:center;
    const radius=activeZoneRadius||parseInt(currentSettings.radius,10)||400;

    // Current safe zone: solid boundary.
    if(!zone){
        zone=L.circle(zoneLocation,{radius:radius,color:'#e7e4eb',weight:2.5,opacity:.95,dashArray:null,fillColor:'#f5a623',fillOpacity:.035,interactive:false}).addTo(map);
        zoneEdge=L.circle(zoneLocation,{radius:radius+10,color:'#f5a623',weight:2,opacity:.9,fill:false,interactive:false}).addTo(map);
    }else{
        zone.setLatLng(zoneLocation).setRadius(radius);
        zoneEdge.setLatLng(zoneLocation).setRadius(radius+10);
    }

    // Preview the next zone with a dotted outline. It stays visible before
    // the shrink begins, then moves with the safe-zone animation.
    const previewRadius=Math.max(10,Math.round(radius*0.85));
    if(!nextZonePreview){
        nextZonePreview=L.circle(zoneLocation,{
            radius:previewRadius,
            color:'#22d3ee',
            weight:3,
            opacity:.95,
            dashArray:'2 9',
            lineCap:'round',
            fill:false,
            interactive:false
        }).addTo(map);
    }else{
        nextZonePreview.setLatLng(zoneLocation).setRadius(previewRadius);
    }
    document.getElementById('zone-txt').textContent='ZONE '+Math.round(radius)+'m';
}
function ensureZoneCenter(lat,lng){if(!settingsLoaded||!gameStartedAt)return;
    zoneStateRef.transaction(state=>{
        if(state&&state.center)return state;
        return {center:{lat:lat,lng:lng},baseRadius:parseInt(currentSettings.radius,10)||400};
    },(error,committed,snapshot)=>{
        if(error){console.warn('Could not initialize zone center:',error);return}
        const state=snapshot.val();
        if(state&&state.center){zoneCenter=state.center;zoneBaseRadius=Number(state.baseRadius)||parseInt(currentSettings.radius,10)||400;activeZoneRadius=zoneBaseRadius;setZone([lat,lng]);if(lastKnownCoords)checkZoneBoundary(lastKnownCoords.lat,lastKnownCoords.lng)}
    });
}
function checkZoneBoundary(lat,lng){
    if(!zoneCenter||!gameStartedAt||eliminationSubmitted)return;
    if(distanceMeters({lat:lat,lng:lng},zoneCenter)<=activeZoneRadius){
        myPlayerRef.child('outsideSince').remove().catch(()=>{});
        document.getElementById('zone-warning').classList.add('hidden');
        return;
    }
    myPlayerRef.child('outsideSince').transaction(value=>value||Date.now(),(error,committed,snapshot)=>{
        if(error)console.warn('Could not start zone return timer:',error);
    });
}
function updateZoneShrink(elapsed){
    const intervalMs=durationMs(currentSettings.shrinkInterval||'2 min',2);
    const shrinkDurationMs=10000; // Every shrink takes exactly 10 seconds.
    const shrinkCount=intervalMs>0?Math.floor(elapsed/intervalMs):0;
    const shrinkStart=shrinkCount*intervalMs;
    const previousRadius=activeZoneRadius;
    const startRadius=Math.max(10,Math.round(zoneBaseRadius*Math.pow(0.85,shrinkCount)));
    const targetRadius=Math.max(10,Math.round(zoneBaseRadius*Math.pow(0.85,shrinkCount+1)));
    const timeIntoCycle=intervalMs>0?elapsed-shrinkStart:0;
    const shrinking=shrinkCount>0 && timeIntoCycle<shrinkDurationMs;
    const shrinkProgress=shrinking?Math.min(1,timeIntoCycle/shrinkDurationMs):0;

    // During the 10-second transition, animate from the old radius to the new one.
    // Otherwise keep the current safe radius stable until the next shrink.
    activeZoneRadius=shrinking
        ? Math.max(10,startRadius+(targetRadius-startRadius)*shrinkProgress)
        : startRadius;

    if(activeZoneRadius!==previousRadius&&lastKnownCoords)checkZoneBoundary(lastKnownCoords.lat,lastKnownCoords.lng);
    if(zoneCenter)setZone([zoneCenter.lat,zoneCenter.lng]);

    const nextShrinkAt=(shrinkCount+1)*intervalMs;
    const remainingMs=Math.max(0,nextShrinkAt-elapsed);
    document.getElementById('zone-shrink-timer').textContent=
        elapsed>=durationMs(currentSettings.matchLength,30)
        ? 'MATCH END'
        : (shrinking?'SHRINKING '+Math.max(0,Math.ceil((shrinkDurationMs-timeIntoCycle)/1000))+'s':formatTime(Math.ceil(remainingMs/1000)));
}
function updateBoundaryWarning(now){
    const player=latestPlayers&&latestPlayers[playerId];
    const warning=document.getElementById('zone-warning');
    if(!player||!player.outsideSince||player.eliminated){warning.classList.add('hidden');return}
    const secondsLeft=Math.max(0,30-Math.floor((now-player.outsideSince)/1000));
    warning.textContent='OUTSIDE SAFE ZONE — RETURN IN '+secondsLeft+'s OR YOU WILL BE ELIMINATED';
    warning.classList.remove('hidden');
    if(secondsLeft===0&&!eliminationSubmitted){
        eliminationSubmitted=true;
        myPlayerRef.update({eliminated:true,eliminatedAt:now,outsideSince:null}).catch(error=>{eliminationSubmitted=false;console.warn('Could not save zone elimination:',error)});
    }
}
function distanceMeters(a,b){const rad=n=>n*Math.PI/180;const dLat=rad(b.lat-a.lat),dLng=rad(b.lng-a.lng);const h=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;return 6371000*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}
function publishLocation(position){const c=position.coords,lat=c.latitude,lng=c.longitude,now=Date.now();const moved=lastSentLocation?distanceMeters(lastSentLocation,{lat:lat,lng:lng}):Infinity;if(lastSentLocation&&moved<2&&now-lastLocationWriteAt<1000)return;const location={lat:lat,lng:lng,accuracy:Number.isFinite(c.accuracy)?c.accuracy:0,heading:Number.isFinite(c.heading)?c.heading:currentHeading,updatedAt:now};if(Number.isFinite(c.speed))location.speed=c.speed;myPlayerRef.child('location').set(location).catch(e=>console.warn('Could not share location:',e));lastSentLocation={lat:lat,lng:lng,heading:currentHeading};lastLocationWriteAt=now}
function setPhoneHeading(heading){currentHeading=((heading%360)+360)%360;if(marker)marker.setIcon(pointerIcon(assignedRole,currentHeading));const now=Date.now();if(lastSentLocation&&(Math.abs(currentHeading-(lastSentLocation.heading||0))>3||now-lastHeadingWriteAt>1000)){myPlayerRef.child('location').update({heading:currentHeading,updatedAt:now}).catch(e=>console.warn('Could not share compass direction:',e));lastSentLocation.heading=currentHeading;lastHeadingWriteAt=now}}
function onDeviceOrientation(event){let heading;if(Number.isFinite(event.webkitCompassHeading)){heading=event.webkitCompassHeading}else if(Number.isFinite(event.alpha)){const screenAngle=(screen.orientation&&Number.isFinite(screen.orientation.angle)?screen.orientation.angle:(Number.isFinite(window.orientation)?window.orientation:0));heading=360-event.alpha-screenAngle}else{return}setPhoneHeading(heading)}
async function enableCompass(){const button=document.getElementById('compass-btn');button.disabled=true;try{if(typeof DeviceOrientationEvent==='undefined'){button.textContent='COMPASS NOT SUPPORTED';return}if(typeof DeviceOrientationEvent.requestPermission==='function'){const permission=await DeviceOrientationEvent.requestPermission();if(permission!=='granted'){button.textContent='COMPASS PERMISSION DENIED';button.disabled=false;return}}compassEnabled=true;if('ondeviceorientationabsolute' in window)window.addEventListener('deviceorientationabsolute',onDeviceOrientation,true);else window.addEventListener('deviceorientation',onDeviceOrientation,true);button.textContent='🧭 PHONE DIRECTION ON'}catch(error){console.warn('Compass unavailable:',error);button.textContent='COMPASS UNAVAILABLE';button.disabled=false}}
function onLocation(position){
    const c=position.coords,latLng=[c.latitude,c.longitude];
    if(!compassEnabled&&Number.isFinite(c.heading))currentHeading=c.heading;
    if(!marker){marker=L.marker(latLng,{icon:pointerIcon(assignedRole,currentHeading),zIndexOffset:1000}).addTo(map);map.setView(latLng,18);accuracyCircle=L.circle(latLng,{radius:c.accuracy||0,color:'#10b981',weight:1,opacity:.4,fillColor:'#10b981',fillOpacity:.08,interactive:false}).addTo(map)}
    else{marker.setLatLng(latLng);marker.setIcon(pointerIcon(assignedRole,currentHeading));accuracyCircle.setLatLng(latLng).setRadius(c.accuracy||0)}
    const gps=document.getElementById('gps-status');gps.textContent='GPS ACCURACY ±'+Math.round(c.accuracy||0)+' m';gps.classList.remove('hidden');

function updateRemotePlayers(players){
    latestPlayers=players;
    const active=new Set();
    if(players&&revealActive){
        Object.entries(players).forEach(([id,p])=>{
            if(id===playerId||!p||p.eliminated||!p.location||!Number.isFinite(p.location.lat)||!Number.isFinite(p.location.lng))return;
            const isTarget=assignedRole==='HUNTER'?p.assignedRole==='SHADOW':p.assignedRole==='HUNTER';
            if(!isTarget)return;
            active.add(id);
            const role=p.assignedRole==='HUNTER'?'HUNTER':'SHADOW',pos=[p.location.lat,p.location.lng];
            if(!remoteMarkers[id]){
                remoteMarkers[id]=L.marker(pos,{icon:pointerIcon(role,p.location.heading),title:p.name||role}).addTo(map);
                remoteMarkers[id].bindTooltip(p.name||role);
                remoteAccuracyCircles[id]=L.circle(pos,{radius:p.location.accuracy||0,color:role==='HUNTER'?'#f43f5e':'#10b981',weight:1,opacity:.3,fillOpacity:.04,interactive:false}).addTo(map);
            }else{
                remoteMarkers[id].setLatLng(pos).setIcon(pointerIcon(role,p.location.heading));
                remoteMarkers[id].setTooltipContent(p.name||role);
                remoteAccuracyCircles[id].setLatLng(pos).setRadius(p.location.accuracy||0);
            }
        });
    }
    Object.keys(remoteMarkers).forEach(id=>{
        if(!active.has(id)){map.removeLayer(remoteMarkers[id]);delete remoteMarkers[id];if(remoteAccuracyCircles[id]){map.removeLayer(remoteAccuracyCircles[id]);delete remoteAccuracyCircles[id]}}
    });
}
playersRef.on('value',snapshot=>{
    const players=snapshot.val()||{},eliminatedNow=new Set();
    let survivorCount=0;
    Object.entries(players).forEach(([id,p])=>{
        if(!p)return;
        if(p.assignedRole==='SHADOW'&&!p.eliminated)survivorCount++;

            eliminatedNow.add(id);

                const notice=document.getElementById('elimination-notice');

                noticeTimeout=setTimeout(()=>notice.classList.add('hidden'),5000);
            }
        }
    });
    knownEliminations=eliminatedNow;playersSnapshotInitialized=true;
    document.getElementById('survivor-count').textContent='SURVIVORS: '+survivorCount;
    latestPlayers=players;updateRemotePlayers(players);
    const p=players[playerId];
    if(p&&p.assignedRole&&p.assignedRole!=='PENDING'){
        assignedRole=p.assignedRole;localStorage.setItem('shadowhunt_assigned_role',assignedRole);
        if(marker)marker.setIcon(pointerIcon(assignedRole,currentHeading));
        const badge=document.getElementById('role-badge');badge.textContent=assignedRole;
        if(assignedRole==='HUNTER'){badge.className='px-3 py-1 rounded-lg font-mono text-xs font-black bg-rose-950 text-rose-300 border border-rose-500/40';document.getElementById('status-title').textContent='HUNTERS LOCKED'}
    }
});
settingsRef.on('value',s=>{
    if(!s.val())return;
    currentSettings=s.val();if(!currentSettings.shrinkInterval)currentSettings.shrinkInterval='2 min';
    settingsLoaded=true;if(!zoneCenter)zoneBaseRadius=parseInt(currentSettings.radius,10)||400;

zoneStateRef.on('value',s=>{
    const state=s.val();if(!state||!state.center)return;
    zoneCenter=state.center;zoneBaseRadius=Number(state.baseRadius)||parseInt(currentSettings.radius,10)||400;
    if(gameStartedAt)updateZoneShrink(Math.max(0,Date.now()-gameStartedAt));
    if(marker)setZone(marker.getLatLng());
    if(lastKnownCoords)checkZoneBoundary(lastKnownCoords.lat,lastKnownCoords.lng);
});
gameStatusRef.transaction(status=>{if(!status||!status.started)return;if(!status.startedAt)status.startedAt=Date.now();return status});
gameStatusRef.on('value',s=>{const status=s.val();if(!status||!status.started)return;gameStartedAt=status.startedAt||Date.now();syncTimers()});
function durationMs(value,fallback){const text=String(value||''),mm=[...text.matchAll(/(\d+)\s*(?:min|m)(?!s)/gi)],ss=[...text.matchAll(/(\d+)\s*s/gi)];let mins=mm.reduce((n,m)=>n+Number(m[1]),0),secs=ss.reduce((n,m)=>n+Number(m[1]),0);if(!mm.length&&!ss.length)mins=parseInt(text,10)||fallback;return mins*60000+secs*1000}
function syncTimers(){if(settingsLoaded&&gameStartedAt){startTimers(currentSettings,gameStartedAt);if(lastKnownCoords&&!zoneCenter)ensureZoneCenter(lastKnownCoords.lat,lastKnownCoords.lng)}}
function formatTime(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startTimers(settings,startedAt){
    if(matchInterval)clearInterval(matchInterval);
    const matchDuration=durationMs(settings.matchLength,30),headDuration=durationMs(settings.headstart,2);
    const revealEvery=45000,revealLength=10000;
    function update(){
        const now=Date.now(),elapsed=Math.max(0,now-startedAt),matchLeft=Math.max(0,Math.ceil((matchDuration-elapsed)/1000)),headLeft=Math.max(0,Math.ceil((headDuration-elapsed)/1000)),cyclePosition=elapsed%revealEvery,inReveal=elapsed>=revealEvery&&cyclePosition<revealLength;
        const nextRevealAt=startedAt+(Math.floor(elapsed/revealEvery)+1)*revealEvery,revealIn=Math.max(0,Math.ceil((nextRevealAt-now)/1000)),visibleFor=inReveal?Math.max(0,Math.ceil((revealLength-cyclePosition)/1000)):0;
        document.getElementById('match-timer').textContent=formatTime(matchLeft);
        if(headLeft>0)document.getElementById('headstart-timer').textContent=formatTime(headLeft);
        else{document.getElementById('status-title').textContent=assignedRole==='HUNTER'?'GO FIND THEM':'HUNT ACTIVE';document.getElementById('headstart-timer').textContent='ACTIVE';if(assignedRole!=='HUNTER')document.getElementById('tagged-btn-container').classList.remove('hidden')}
        revealActive=inReveal;updateZoneShrink(elapsed);updateBoundaryWarning(now);
        document.getElementById('reveal-in').textContent=inReveal?'NOW':formatTime(revealIn);
        document.getElementById('reveal-visible').textContent=inReveal?formatTime(visibleFor):'—';
        updateRemotePlayers(latestPlayers);
        if(matchLeft===0)clearInterval(matchInterval);
    }
    update();matchInterval=setInterval(update,100);
}
function centerMap(){if(marker)map.setView(marker.getLatLng(),18)}
let chatListenerStarted=false,chatUnreadCount=0,chatNotificationInitialized=false,chatNotificationTimeout=null;
const knownChatMessageIds=new Set();
function startChatNotifications(){
    roomRef.child('chatMessages').on('value',snapshot=>{
        const fresh=[];
        snapshot.forEach(child=>{const message=child.val();if(message&&message.playerId!==playerId&&!knownChatMessageIds.has(child.key))fresh.push({id:child.key,message:message})});
        if(!chatNotificationInitialized){snapshot.forEach(child=>knownChatMessageIds.add(child.key));chatNotificationInitialized=true;return}
        snapshot.forEach(child=>knownChatMessageIds.add(child.key));
        if(document.getElementById('chat-modal').classList.contains('hidden')&&fresh.length){
            chatUnreadCount+=fresh.length;
            const badge=document.getElementById('chat-unread-badge');badge.textContent=chatUnreadCount>99?'99+':String(chatUnreadCount);badge.classList.remove('hidden');badge.classList.add('flex');
            const popup=document.getElementById('chat-message-popup');popup.textContent=fresh.length===1?'New message from '+(fresh[0].message.name||'player'):fresh.length+' new messages';popup.classList.remove('hidden');
            if(chatNotificationTimeout)clearTimeout(chatNotificationTimeout);chatNotificationTimeout=setTimeout(()=>popup.classList.add('hidden'),5000);
        }
    },error=>console.warn('Chat notifications unavailable:',error));
}
function openChat(){
    const modal=document.getElementById('chat-modal');modal.classList.remove('hidden');chatUnreadCount=0;
    document.getElementById('chat-unread-badge').classList.add('hidden');document.getElementById('chat-unread-badge').classList.remove('flex');document.getElementById('chat-message-popup').classList.add('hidden');document.getElementById('chat-input').focus();
    if(chatListenerStarted)return;chatListenerStarted=true;
    roomRef.child('chatMessages').orderByChild('sentAt').limitToLast(100).on('value',snapshot=>{
        const list=document.getElementById('chat-messages'),wasNearBottom=list.scrollHeight-list.scrollTop-list.clientHeight<80;list.replaceChildren();
        snapshot.forEach(child=>{
            const message=child.val();if(!message||typeof message.text!=='string')return;
            const row=document.createElement('div');row.className='max-w-[90%] '+(message.playerId===playerId?'ml-auto':'mr-auto');
            const name=document.createElement('div');name.className='text-[10px] font-bold mb-1 '+(message.playerId===playerId?'text-purple-300 text-right':'text-emerald-300');name.textContent=message.playerId===playerId?'You':(message.name||'Player');
            const bubble=document.createElement('div');bubble.className='rounded-2xl px-3 py-2 text-sm break-words '+(message.playerId===playerId?'bg-purple-700 text-white':'bg-slate-800 text-slate-100');bubble.textContent=message.text;
            row.append(name,bubble);list.appendChild(row);
        });
        document.getElementById('chat-status').textContent=snapshot.numChildren()+' recent messages · room chat';if(wasNearBottom)list.scrollTop=list.scrollHeight;
    },error=>{document.getElementById('chat-status').textContent='Chat unavailable: '+error.message});
}
function closeChat(){document.getElementById('chat-modal').classList.add('hidden')}
document.getElementById('chat-form').addEventListener('submit',async event=>{
    event.preventDefault();const input=document.getElementById('chat-input'),text=input.value.trim();if(!text)return;
    const sendButton=document.getElementById('chat-send');sendButton.disabled=true;
    try{await roomRef.child('chatMessages').push({name:myName,playerId:playerId,text:text,sentAt:firebase.database.ServerValue.TIMESTAMP});input.value='';input.focus()}
    catch(error){console.warn('Could not send chat message:',error);document.getElementById('chat-status').textContent='Message did not send. Check Firebase access and connection.'}
    finally{sendButton.disabled=false}
});
function openTaggedModal(){document.getElementById('tagged-modal').classList.remove('hidden')}
function closeTaggedModal(){document.getElementById('tagged-modal').classList.add('hidden')}
function confirmTagged(tagged){closeTaggedModal();if(tagged)myPlayerRef.update({eliminated:true,eliminatedAt:Date.now()}).catch(e=>{console.warn('Could not save eliminated status:',e);alert('Could not save status. Check your connection.')})}
startChatNotifications();
window.addEventListener('resize',()=>map.invalidateSize());
</script>
