<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowHunt — Real-world GPS manhunt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #090613; color: #ffffff; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        @keyframes radar-sweep {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .radar-beam { animation: radar-sweep 4s linear infinite; transform-origin: center; }
        @keyframes ripple {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .ping-ripple { animation: ripple 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    </style>
</head>
<body class="overflow-x-hidden selection:bg-purple-500 selection:text-white min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="max-w-7xl w-full mx-auto px-6 py-6 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-purple-600 rounded-lg flex items-center justify-center font-bold text-white shadow-lg shadow-purple-900/50">SH</div>
            <span class="font-bold text-lg tracking-wide">ShadowHunt</span>
        </div>
        <a href="auth.html" class="bg-purple-600 hover:bg-purple-500 text-white font-semibold px-5 py-2.5 rounded-xl text-sm transition shadow-lg shadow-purple-600/30">
            Play now
        </a>
    </header>

    <!-- Hero Section -->
    <section class="max-w-7xl mx-auto px-6 pt-12 pb-20 grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
        <div class="space-y-6">
            <h1 class="text-5xl lg:text-7xl font-black tracking-tight leading-none">
                Your city is <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-400">the map.</span>
            </h1>
            <p class="text-lg text-slate-400 font-medium">Hunters vs Shadows. On foot, on real streets.</p>
            <div class="flex flex-wrap gap-4 pt-4">
                <a href="auth.html" class="bg-white hover:bg-slate-200 text-slate-950 font-bold px-6 py-3.5 rounded-xl transition flex items-center gap-2 text-sm shadow-xl">
                    Play in your browser →
                </a>
            </div>
        </div>

        <!-- Radar Animation Box -->
        <div class="relative flex justify-center">
            <div class="w-full max-w-md bg-slate-900/90 border border-purple-500/30 rounded-3xl p-5 shadow-2xl shadow-purple-950/80 backdrop-blur-xl relative overflow-hidden">
                <div class="h-72 w-full bg-slate-950 rounded-2xl border border-purple-500/20 relative overflow-hidden flex items-center justify-center">
                    <div class="absolute inset-0 bg-[linear-gradient(to_right,#2e106515_1px,transparent_1px),linear-gradient(to_bottom,#2e106515_1px,transparent_1px)] bg-[size:24px_24px]"></div>
                    <div class="absolute w-60 h-60 rounded-full border-2 border-purple-500/60 flex items-center justify-center">
                        <div class="absolute inset-0 rounded-full radar-beam bg-gradient-to-tr from-transparent via-purple-500/10 to-purple-400/30"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
