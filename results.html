<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ShadowHunt — Results</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#05030a;color:#fff;font-family:Inter,sans-serif}.font-mono{font-family:'JetBrains Mono',monospace}
</style>
</head>
<body class="bg-[#05030a] text-white flex flex-col items-center justify-start min-h-screen p-4">

<div class="w-full max-w-md space-y-5 pb-12 pt-4">
    <!-- Header Title -->
    <h1 id="res-header-title" class="text-3xl font-black text-center tracking-tight text-white">Hunters won.</h1>
    
    <!-- Map / Result Card -->
    <div class="bg-slate-950 border border-slate-800 rounded-3xl p-4 relative overflow-hidden shadow-2xl space-y-4">
        <!-- Top Badge & Name -->
        <div class="flex justify-between items-center z-10 relative">
            <span id="res-badge" class="px-3 py-1 rounded-full font-mono text-[10px] font-black uppercase tracking-wider bg-rose-950/80 text-rose-400 border border-rose-500/40">DEFEAT</span>
            <span id="res-role-label" class="font-mono text-xs font-bold text-slate-400 uppercase tracking-widest">SHADOW</span>
        </div>
        <div id="res-player-name" class="text-2xl font-black uppercase tracking-wider text-white">GAND_PHAD_DUNGA</div>
        
        <!-- Mini Map Container -->
        <div id="res-map" class="w-full h-48 rounded-2xl overflow-hidden border border-slate-800 relative bg-slate-900"></div>
        
        <!-- Distance & Time -->
        <div class="grid grid-cols-2 gap-4 pt-1">
            <div>
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Distance</div>
                <div id="res-distance" class="text-2xl font-mono font-black text-emerald-400">0 m</div>
            </div>
            <div>
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Time in Match</div>
                <div id="res-time" class="text-2xl font-mono font-black text-rose-400">00:45</div>
            </div>
        </div>
        
        <!-- Branding Footer inside card -->
        <div class="pt-2 border-t border-slate-900 flex items-center justify-between text-[10px] font-mono text-slate-400">
            <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-purple-500 inline-block"></span><span class="font-bold text-white">SHADOWHUNT</span></div>
            <span>shadowhunt.fun</span>
        </div>
    </div>
    
    <!-- Subtitle description -->
    <p id="res-subtitle" class="text-center text-xs text-slate-400 font-medium">All Shadows were tagged before time ran out.</p>
    
    <!-- Player Status Card -->
    <div id="res-status-card" class="bg-slate-950 border border-slate-800 rounded-2xl p-4 flex items-center gap-4 shadow-lg">
        <div id="res-status-icon-bg" class="w-12 h-12 rounded-xl bg-rose-950/80 border border-rose-500/40 flex items-center justify-center text-rose-400 text-xl font-black">✕</div>
        <div>
            <div id="res-status-text" class="font-bold text-rose-400 text-sm">You were tagged</div>
            <div id="res-status-sub" class="text-xs text-slate-400">Playing as Shadow</div>
        </div>
    </div>
    
    <!-- Match Stats Section -->
    <div class="space-y-3 pt-2">
        <div class="flex items-center gap-2 text-xs font-black tracking-wider uppercase text-slate-300 px-1">
            <span>📊</span> Match Stats
        </div>
        
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-950 border border-slate-800/80 rounded-2xl p-4 space-y-2">
                <div class="w-8 h-8 rounded-xl bg-slate-900 flex items-center justify-center text-slate-300">👥</div>
                <div id="stat-players" class="text-2xl font-mono font-black text-white">2</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Players</div>
            </div>
            
            <div class="bg-slate-950 border border-slate-800/80 rounded-2xl p-4 space-y-2">
                <div class="w-8 h-8 rounded-xl bg-emerald-950/50 text-emerald-400 flex items-center justify-center">👁️</div>
                <div id="stat-survived" class="text-2xl font-mono font-black text-white">0</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Survived</div>
            </div>
            
            <div class="bg-slate-950 border border-slate-800/80 rounded-2xl p-4 space-y-2">
                <div class="w-8 h-8 rounded-xl bg-rose-950/50 text-rose-400 flex items-center justify-center">🎯</div>
                <div id="stat-tagged" class="text-2xl font-mono font-black text-white">1</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Tagged</div>
            </div>
            
            <div class="bg-slate-950 border border-slate-800/80 rounded-2xl p-4 space-y-2">
                <div class="w-8 h-8 rounded-xl bg-amber-950/50 text-amber-400 flex items-center justify-center">🛡️</div>
                <div id="stat-hunters" class="text-2xl font-mono font-black text-white">1</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Hunters</div>
            </div>
            
            <div class="bg-slate-950 border border-slate-800/80 rounded-2xl p-4 space-y-2">
                <div class="w-8 h-8 rounded-xl bg-purple-950/50 text-purple-400 flex items-center justify-center">📡</div>
                <div id="stat-pulses" class="text-2xl font-mono font-black text-white">0</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Pulses</div>
            </div>
            
            <div class="bg-slate-950 border border-slate-800/80 rounded-2xl p-4 space-y-2">
                <div class="w-8 h-8 rounded-xl bg-rose-950/50 text-rose-400 flex items-center justify-center">⚡</div>
                <div id="stat-total-tags" class="text-2xl font-mono font-black text-white">1</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Tags</div>
            </div>
        </div>
    </div>
    
    <!-- Action Buttons -->
    <div class="space-y-3 pt-4">
        <button onclick="location.href='index.html'" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-black py-4 rounded-2xl uppercase tracking-wider flex items-center justify-center gap-2 shadow-lg shadow-purple-600/30 transition-all">
            <span>🔄</span> Rejoin Lobby
        </button>
        <button onclick="location.href='index.html'" class="w-full bg-slate-900 hover:bg-slate-800 border border-slate-700 text-white font-black py-4 rounded-2xl uppercase tracking-wider flex items-center justify-center gap-2 transition-all">
            <span>🏠</span> Back to Home
        </button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Initialize mini map preview
    const resMap = L.map('res-map', {zoomControl: false, attributionControl: false}).setView([28.6139, 77.2090], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19}).addTo(resMap);
    L.marker([28.6139, 77.2090]).addTo(resMap);
</script>
</body>
</html>
